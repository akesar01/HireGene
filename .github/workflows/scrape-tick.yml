name: Scrape tick

on:
  # GitHub's frequent schedule never started this workflow. The daily
  # production scrape starts it. This once-a-day entry is only a backup.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: hiregene-scrape-tick
  cancel-in-progress: false

jobs:
  tick:
    name: Scrape due hiring managers in batches of 5
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Drain due recruiters
        env:
          SCRAPE_TICK_TOKEN: ${{ secrets.SCRAPE_TICK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SCRAPE_TICK_TOKEN" ]; then
            echo "SCRAPE_TICK_TOKEN is not set" >&2
            exit 1
          fi
          for batch in $(seq 1 24); do
            curl -fsS -X POST "https://backend-umber-nu-43.vercel.app/api/cron/scrape" \
              -H "Authorization: Bearer ${SCRAPE_TICK_TOKEN}" \
              -H "Content-Type: application/json" \
              -o /tmp/scrape.json
            remaining=$(python3 -c 'import json; d=json.load(open("/tmp/scrape.json")); created=sum((r.get("jobsCreated") or 0) for r in d.get("results") or []); print(int(d.get("remaining") or 0)); print("processed", d.get("processed"), "remaining", d.get("remaining"), "created", created, file=__import__("sys").stderr)')
            echo "batch ${batch}: remaining ${remaining}"
            if [ "$remaining" = "0" ]; then
              echo "all due hiring managers scraped"
              exit 0
            fi
            echo "waiting 10 minutes before the next 5"
            sleep 600
          done
          echo "stopped after 24 batches"
          exit 1
